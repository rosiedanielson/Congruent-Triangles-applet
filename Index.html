<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triangle builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#eef4f8;--grid:#cfdfea;--grid2:#b4cbdb;--ink:#1c2a39;--muted:#51647a;--card:#fff;--line:#c5d3df;
  --a:#c2255c;--b:#1971c2;--c:#2b8a3e;--bad:#c92a2a;--fill:rgba(28,42,57,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121c26;--grid:#1f2f3e;--grid2:#2d4358;--ink:#e8eff6;--muted:#9db0c3;--card:#1a2733;--line:#2f4356;
  --a:#ff6b9a;--b:#6db3ff;--c:#6fd283;--bad:#ff8787;--fill:rgba(232,239,246,.07);}}
:root[data-theme="dark"]{
  --paper:#121c26;--grid:#1f2f3e;--grid2:#2d4358;--ink:#e8eff6;--muted:#9db0c3;--card:#1a2733;--line:#2f4356;
  --a:#ff6b9a;--b:#6db3ff;--c:#6fd283;--bad:#ff8787;--fill:rgba(232,239,246,.07);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.7rem;margin:0 0 4px}
.sub{margin:0 0 18px;color:var(--muted)}
.layout{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:16px}
.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;margin-bottom:14px}
.field label{font-weight:700;font-size:1.05rem}
.field small{grid-column:1/-1;color:var(--muted);font-size:.85rem}
.field input{width:104px;font:700 1.25rem "Atkinson Hyperlegible",system-ui,sans-serif;padding:6px 8px;border-radius:6px;border:3px solid;background:var(--card);color:var(--ink)}
.f-a label,.f-a input{color:var(--a);border-color:var(--a)}
.f-b label,.f-b input{color:var(--b);border-color:var(--b)}
.f-c label,.f-c input{color:var(--c);border-color:var(--c)}
.f-a input,.f-b input,.f-c input{color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
button{font:700 .95rem "Atkinson Hyperlegible",system-ui,sans-serif;padding:8px 12px;border-radius:6px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--ink);color:var(--card)}
button:hover{opacity:.85}
h2{font-size:1rem;margin:18px 0 8px}
.checks{display:grid;gap:6px;font-size:.95rem}
.chk{padding:6px 8px;border-radius:6px;border:2px solid var(--line)}
.chk.ok{border-color:var(--c)}.chk.no{border-color:var(--bad);color:var(--bad);font-weight:700}
.stage{background:var(--paper);border:2px solid var(--line);border-radius:10px;overflow:hidden}
svg{display:block;width:100%;height:auto}
.msg{margin:0;padding:10px 14px;border-top:2px solid var(--line);background:var(--card);min-height:3.2em}
.msg.bad{color:var(--bad);font-weight:700}
.msg:empty{display:none}
.rot{margin:4px 0 16px}
.rot label{display:block;font-weight:700;font-size:1.05rem;margin-bottom:6px}
.rot input{width:100%;accent-color:var(--ink);height:28px}
.side{fill:none;stroke-width:5;stroke-linecap:round}
.lbl{font:700 17px "Atkinson Hyperlegible",system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}
.vtx{font:700 16px "Atkinson Hyperlegible",system-ui,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:5px}
.fade{opacity:0;transition:opacity .4s}.fade.on{opacity:1}
@media(prefers-reduced-motion:reduce){.fade{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Triangle builder</h1>
  <p class="sub">Type in three side lengths.</p>
  <div class="layout">
    <section class="panel" aria-label="Side lengths">
      <div class="field f-a"><label for="ia">Side a</label><input id="ia" type="number" inputmode="decimal" min="0.5" max="30" step="0.5" value="4"></div>
      <div class="field f-b"><label for="ib">Side b</label><input id="ib" type="number" inputmode="decimal" min="0.5" max="30" step="0.5" value="5"></div>
      <div class="field f-c"><label for="ic">Side c</label><input id="ic" type="number" inputmode="decimal" min="0.5" max="30" step="0.5" value="6"></div>
      <div class="rot"><label for="irot">Rotate triangle: <output id="orot">0°</output></label><input id="irot" type="range" min="0" max="360" step="1" value="0"></div>
      <div class="btns">
        <button class="primary" id="build" type="button">Build it</button>
      </div>
      <h2>Can these sides join up?</h2>
      <div class="checks" id="checks"></div>
    </section>
    <section>
      <div class="stage"><svg id="svg" viewBox="0 0 640 440" role="img" aria-label="Triangle drawn to scale"></svg>
      <p class="msg" id="msg" aria-live="polite"></p></div>
    </section>
  </div>
</main>
<script>
(function(){
  var W=640,H=440,PAD=78;
  var $=function(id){return document.getElementById(id)};
  var svg=$('svg'),msg=$('msg'),checks=$('checks');
  var fmt=function(n){return String(+n.toFixed(2))};
  var CSS={a:'var(--a)',b:'var(--b)',c:'var(--c)'};

  function read(){
    var v={};
    ['a','b','c'].forEach(function(k){v[k]=parseFloat($('i'+k).value)});
    return v;
  }
  function validNum(x){return isFinite(x)&&x>=0.5&&x<=30}

  function render(animate){
    var v=read(),ok=validNum(v.a)&&validNum(v.b)&&validNum(v.c);
    if(!ok){
      svg.innerHTML=gridOnly();
      checks.innerHTML='';
      setMsg('Enter each side as a length from 0.5 to 30 cm.',true);
      return;
    }
    var a=v.a,b=v.b,c=v.c;
    var rows=[['a','b','c'],['a','c','b'],['b','c','a']].map(function(t){
      var s=v[t[0]]+v[t[1]],good=s>v[t[2]]+1e-9;
      return {good:good,text:t[0]+' + '+t[1]+' = '+fmt(s)+(good?' is bigger than ':' is not bigger than ')+t[2]+' ('+fmt(v[t[2]])+')'};
    });
    checks.innerHTML=rows.map(function(r){return '<div class="chk '+(r.good?'ok':'no')+'">'+(r.good?'✓ ':'✗ ')+r.text+'</div>'}).join('');
    var allGood=rows.every(function(r){return r.good});

    // Plan: A at origin, B along the base, C by geometry (angles never shown)
    var cx=(b*b+c*c-a*a)/(2*c);
    var h2=b*b-cx*cx,cy=allGood?Math.sqrt(Math.max(h2,0)):0;
    var pts=allGood?{A:[0,0],B:[c,0],C:[cx,cy]}:{A:[0,0],B:[c,0],C:null};
    var minX=allGood?Math.min(0,cx):Math.min(0,c-a,-b)*0+0;
    var maxX=allGood?Math.max(c,cx):c;
    var spanW=Math.max(maxX-minX,0.5),spanH=allGood?Math.max(cy,0.5):0.5;
    if(!allGood){spanH=Math.max(a,b)*0.9;}
    var s=Math.min((W-2*PAD)/spanW,(H-2*PAD)/spanH,60);
    var ox=(W-spanW*s)/2-minX*s;
    var oy=(H+spanH*s)/2; // y of base on screen
    var P=function(p){return [ox+p[0]*s,oy-p[1]*s]};

    var out=grid(ox,oy,s);
    if(!allGood){
      var A=P(pts.A),B=P(pts.B);
      out+='<circle cx="'+B[0]+'" cy="'+B[1]+'" r="'+a*s+'" fill="none" stroke="'+CSS.a+'" stroke-width="3" stroke-dasharray="7 6"/>';
      out+='<circle cx="'+A[0]+'" cy="'+A[1]+'" r="'+b*s+'" fill="none" stroke="'+CSS.b+'" stroke-width="3" stroke-dasharray="7 6"/>';
      out+=line(A,B,'c',false)+dim(A,B,[0,1],'c','c = '+fmt(c)+' cm');
      out+=vert('A',A,[-1,0])+vert('B',B,[1,0]);
      svg.innerHTML=out;
      var bad=rows.find(function(r){return !r.good});
      setMsg('These sides can’t make a triangle. '+bad.text.replace('is not bigger than','is not bigger than')+'. The dashed circles show how far sides a and b can reach, and they never meet.',true);
      return;
    }
    var rot=(parseFloat($('irot').value)||0)*Math.PI/180,cs=Math.cos(rot),sn=Math.sin(rot);
    var g=[(c+cx)/3,cy/3],vs=[pts.A,pts.B,pts.C];
    var R=Math.max.apply(null,vs.map(function(p){return Math.hypot(p[0]-g[0],p[1]-g[1])}));
    var s2=Math.min((W-220)/(2*R),(H-160)/(2*R),60);
    var RP=function(p){var dx=p[0]-g[0],dy=p[1]-g[1];return [W/2+(dx*cs-dy*sn)*s2,H/2-(dx*sn+dy*cs)*s2]};
    out=grid(W/2,H/2,s2);
    var PA=RP(pts.A),PB=RP(pts.B),PC=RP(pts.C);
    var cen=[(PA[0]+PB[0]+PC[0])/3,(PA[1]+PB[1]+PC[1])/3];
    out+='<polygon points="'+PA+' '+PB+' '+PC+'" fill="var(--fill)"/>';
    var sides=[['a',PB,PC],['b',PC,PA],['c',PA,PB]];
    var n=0;
    sides.forEach(function(sd){
      var nrm=outward(sd[1],sd[2],cen);
      out+=line(sd[1],sd[2],sd[0],animate,n);
      out+=dim(sd[1],sd[2],nrm,sd[0],sd[0]+' = '+fmt(v[sd[0]])+' cm',animate,n);
      n++;
    });
    out+=vert('A',PA,unit(PA,cen,-1))+vert('B',PB,unit(PB,cen,-1))+vert('C',PC,unit(PC,cen,-1));
    svg.innerHTML=out;
    if(animate)run();
    setMsg('',false);
  }

  function setMsg(t,bad){msg.textContent=t;msg.className='msg'+(bad?' bad':'')}
  function unit(p,q,sign){var dx=(p[0]-q[0])*sign*-1,dy=(p[1]-q[1])*sign*-1;
    // direction from centroid q toward p when sign=-1 => (p-q)
    dx=p[0]-q[0];dy=p[1]-q[1];var l=Math.hypot(dx,dy)||1;return [dx/l,dy/l]}
  function outward(p,q,cen){
    var dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
    var m=[(p[0]+q[0])/2,(p[1]+q[1])/2];
    if((m[0]-cen[0])*nx+(m[1]-cen[1])*ny<0){nx=-nx;ny=-ny}
    return [nx,ny];
  }
  function line(p,q,k,animate,i){
    return '<line class="side'+(animate?' draw':'')+'" data-i="'+(i||0)+'" x1="'+p[0]+'" y1="'+p[1]+'" x2="'+q[0]+'" y2="'+q[1]+'" stroke="'+CSS[k]+'" pathLength="1"'+(animate?' stroke-dasharray="1" stroke-dashoffset="1"':'')+'/>';
  }
  function dim(p,q,n,k,text,animate,i){
    var o=16,t=6,e=function(pt){return [pt[0]+n[0]*o,pt[1]+n[1]*o]};
    var p2=e(p),q2=e(q),m=[(p2[0]+q2[0])/2+n[0]*18,(p2[1]+q2[1])/2+n[1]*18];
    var tick=function(pt,pp){return '<line x1="'+(pp[0]-n[0]*t)+'" y1="'+(pp[1]-n[1]*t)+'" x2="'+(pp[0]+n[0]*t)+'" y2="'+(pp[1]+n[1]*t)+'" stroke="'+CSS[k]+'" stroke-width="2.5"/>'};
    var ty=m[1]+(n[1]>0.3?10:n[1]<-0.3?-2:5);
    var anchor=n[0]>0.5?'start':n[0]<-0.5?'end':'middle';
    return '<g class="fade'+(animate?'':' on')+'" data-i="'+(i||0)+'"><line x1="'+p2[0]+'" y1="'+p2[1]+'" x2="'+q2[0]+'" y2="'+q2[1]+'" stroke="'+CSS[k]+'" stroke-width="2"/>'+tick(p,p2)+tick(q,q2)+
      '<text class="lbl" x="'+m[0]+'" y="'+ty+'" text-anchor="'+anchor+'" fill="'+CSS[k]+'">'+text+'</text></g>';
  }
  function vert(name,p,d){
    return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="var(--ink)"/>';
  }
  function grid(ox,oy,s){
    var step=s<11?5:1,g='',k0,k1,i;
    k0=Math.floor(-ox/s/step)*step;k1=Math.ceil((W-ox)/s/step)*step;
    for(i=k0;i<=k1;i+=step){var x=ox+i*s;g+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+H+'" stroke="'+(i%5===0?'var(--grid2)':'var(--grid)')+'" stroke-width="'+(i%5===0?1.4:1)+'"/>'}
    k0=Math.floor(-(H-oy)/s/step)*step;k1=Math.ceil(oy/s/step)*step;
    for(i=k0;i<=k1;i+=step){var y=oy-i*s;g+='<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="'+(i%5===0?'var(--grid2)':'var(--grid)')+'" stroke-width="'+(i%5===0?1.4:1)+'"/>'}
    g+='<text x="'+(W-10)+'" y="'+(H-10)+'" text-anchor="end" font-size="14" fill="var(--muted)" font-family="Atkinson Hyperlegible,system-ui,sans-serif">1 square = '+step+' cm</text>';
    return g;
  }
  function gridOnly(){return grid(W/2,H/2,30)}

  function run(){
    var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var lines=svg.querySelectorAll('line.draw'),labs=svg.querySelectorAll('g.fade');
    lines.forEach(function(l){
      var i=+l.getAttribute('data-i');
      if(reduce){l.removeAttribute('stroke-dasharray');l.removeAttribute('stroke-dashoffset');return}
      l.getBoundingClientRect();
      l.style.transition='stroke-dashoffset .7s ease '+(i*0.8)+'s';
      requestAnimationFrame(function(){l.setAttribute('stroke-dashoffset','0')});
    });
    labs.forEach(function(g){
      var i=+g.getAttribute('data-i');
      setTimeout(function(){g.classList.add('on')},reduce?0:i*800+600);
    });
  }

  ['ia','ib','ic'].forEach(function(id){$(id).addEventListener('input',function(){render(false)})});
  $('build').addEventListener('click',function(){render(true)});
  $('irot').addEventListener('input',function(){$('orot').textContent=this.value+'°';render(false)});
  render(true);
})();
</script>
</body>
</html>
